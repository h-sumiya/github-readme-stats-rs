[package]
name = "github-readme-stats-rs"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
axum = { version = "0.8.4", features = ["query"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
dashmap = "6.1.0"
once_cell = "1.21.3"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
